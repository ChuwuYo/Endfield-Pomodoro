name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 跟随 Node.js 24 LTS 的最新补丁版本
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm check` 使用 biome --write；随后校验工作区未被改写，避免 CI 静默“修过又绿”
      - name: Check
        run: pnpm check

      - name: Ensure check left working tree clean
        run: test -z "$(git status --porcelain)"

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
